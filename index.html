<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双端客户系统 · 小组隔离</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #e8edf5 0%, #d5dde8 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
        html { font-size: 120%; }
        .entry-screen { display: flex; gap: 48px; background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); padding: 64px 80px; border-radius: 48px; box-shadow: 0 30px 60px rgba(0,0,0,0.12), 0 0 0 1px rgba(255,255,255,0.3); flex-wrap: wrap; justify-content: center; }
        .entry-btn { padding: 28px 52px; border: none; border-radius: 60px; font-size: 1.4rem; font-weight: 600; cursor: pointer; transition: all 0.25s ease; min-width: 200px; }
        .entry-btn:hover { transform: scale(1.04); box-shadow: 0 12px 32px rgba(0,0,0,0.15); }
        .entry-btn.reception { background: linear-gradient(135deg, #2b6cb0, #1a4f8b); color: white; }
        .entry-btn.third { background: linear-gradient(135deg, #2f855a, #1f6a47); color: white; }
        .app { display: none; width: 100%; max-width: 1480px; margin: 0 auto; height: 100vh; max-height: 920px; flex-direction: column; background: rgba(255,255,255,0.7); backdrop-filter: blur(20px); border-radius: 32px; padding: 16px 20px; box-shadow: 0 30px 60px rgba(0,0,0,0.10), 0 0 0 1px rgba(255,255,255,0.2); overflow: hidden; }
        .app.active { display: flex; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 4px 0 10px 0; flex-shrink: 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .back-btn { background: rgba(0,0,0,0.04); border: none; padding: 6px 18px; border-radius: 30px; font-weight: 500; cursor: pointer; font-size: 0.8rem; color: #4a5568; transition: 0.2s; }
        .back-btn:hover { background: rgba(0,0,0,0.08); }
        .page-title { font-size: 1.1rem; font-weight: 700; color: #1a202c; }
        .header-right { font-size: 0.7rem; color: #a0aec0; background: rgba(0,0,0,0.03); padding: 4px 16px; border-radius: 30px; }
        .two-col { display: grid; grid-template-columns: 1fr 1.5fr; gap: 14px; flex: 1; min-height: 0; padding-top: 10px; }
        .col { overflow-y: auto; padding-right: 4px; }
        .col::-webkit-scrollbar { width: 4px; }
        .col::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .card { background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); border-radius: 20px; padding: 14px 18px; border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .card-title { font-size: 0.75rem; font-weight: 600; color: #4a5568; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .form-group { margin-bottom: 5px; }
        .form-group label { display: block; font-size: 0.65rem; font-weight: 600; color: #4a5568; margin-bottom: 2px; }
        .form-control { width: 100%; padding: 5px 10px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 0.7rem; background: #fafcff; transition: 0.2s; color: #1a202c; }
        .form-control:focus { border-color: #2b6cb0; outline: none; box-shadow: 0 0 0 3px rgba(43,108,176,0.10); }
        .btn { padding: 4px 14px; border: none; border-radius: 24px; font-weight: 500; font-size: 0.7rem; cursor: pointer; transition: all 0.2s ease; white-space: nowrap; }
        .btn-primary { background: linear-gradient(135deg, #2b6cb0, #1a4f8b); color: white; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(43,108,176,0.25); }
        .btn-success { background: linear-gradient(135deg, #2f855a, #1f6a47); color: white; }
        .btn-success:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(47,133,90,0.25); }
        .btn-danger { background: linear-gradient(135deg, #e53e3e, #c53030); color: white; }
        .btn-danger:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(229,62,62,0.25); }
        .btn-warning { background: linear-gradient(135deg, #d69e2e, #b7791f); color: white; }
        .btn-warning:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(214,158,46,0.25); }
        .btn-outline { background: transparent; border: 1.5px solid #e2e8f0; color: #4a5568; }
        .btn-outline:hover { background: #f7fafc; border-color: #a0aec0; }
        .btn-sm { padding: 2px 10px; font-size: 0.6rem; border-radius: 20px; }
        .btn-xs { padding: 1px 8px; font-size: 0.55rem; border-radius: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
        .btn-group .btn-item { padding: 3px 12px; border: 2px solid #e2e8f0; border-radius: 18px; background: white; color: #4a5568; cursor: pointer; font-size: 0.6rem; font-weight: 500; transition: all 0.15s ease; }
        .btn-group .btn-item:hover { background: #f7fafc; border-color: #a0aec0; }
        .btn-group .btn-item.active { background: #2b6cb0; color: white; border-color: #2b6cb0; box-shadow: 0 2px 8px rgba(43,108,176,0.15); }
        .btn-group .btn-item.all-btn.active { background: #4a5568; border-color: #4a5568; }
        .btn-group .btn-item.code-active { background: #38a169; color: white; border-color: #38a169; box-shadow: 0 2px 8px rgba(56,161,105,0.15); }
        .btn-group-horizontal { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
        .btn-group-horizontal .btn-item { padding: 3px 14px; border: 2px solid #e2e8f0; border-radius: 18px; background: white; color: #4a5568; cursor: pointer; font-size: 0.6rem; font-weight: 500; transition: all 0.15s ease; flex: 0 0 auto; }
        .btn-group-horizontal .btn-item:hover { background: #f7fafc; border-color: #a0aec0; }
        .btn-group-horizontal .btn-item.active { background: #2b6cb0; color: white; border-color: #2b6cb0; box-shadow: 0 2px 8px rgba(43,108,176,0.15); }
        .tag { background: #edf2f7; padding: 2px 10px; border-radius: 16px; font-size: 0.6rem; display: inline-flex; align-items: center; gap: 4px; color: #2d3748; }
        .tag .remove { cursor: pointer; font-weight: bold; color: #a0aec0; font-size: 0.75rem; transition: 0.15s; }
        .tag .remove:hover { color: #e53e3e; }
        .tag-list { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }

        .avatar-large { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #e2e8f0; background: #f7fafc; transition: transform 0.25s; cursor: zoom-in; flex-shrink: 0; }
        .avatar-large:hover { transform: scale(2); box-shadow: 0 12px 40px rgba(0,0,0,0.2); z-index: 10; position: relative; }
        .client-avatar { width: 38px; height: 38px; border-radius: 19px; object-fit: cover; background: #edf2f7; flex-shrink: 0; transition: transform 0.25s; cursor: zoom-in; }
        .client-avatar:hover { transform: scale(2.5); box-shadow: 0 12px 40px rgba(0,0,0,0.2); z-index: 10; position: relative; border: 2px solid #2b6cb0; }
        .detail-avatar { width: 42px; height: 42px; border-radius: 21px; object-fit: cover; background: #edf2f7; flex-shrink: 0; transition: transform 0.25s; cursor: zoom-in; }
        .detail-avatar:hover { transform: scale(2.5); box-shadow: 0 12px 40px rgba(0,0,0,0.2); z-index: 10; position: relative; border: 2px solid #2b6cb0; }
        .client-item { border-bottom: 1px solid #edf2f7; padding: 6px 4px; margin: 2px 0; border-radius: 12px; background: rgba(255,255,255,0.5); transition: 0.15s; }
        .client-item:hover { background: rgba(255,255,255,0.9); }
        .client-item.highlight { background: #fefcbf; border: 2px solid #f6e05e; }
        .client-info { flex: 1; font-size: 0.65rem; line-height: 1.4; display: grid; grid-template-columns: 1fr 1fr; gap: 1px 10px; }
        .client-info .label { color: #718096; font-weight: 500; font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.3px; }
        .client-info .value { color: #1a202c; font-weight: 500; font-size: 0.65rem; }
        .client-row { display: flex; gap: 8px; align-items: flex-start; }
        .client-actions { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 3px; justify-content: flex-end; }
        .search-bar { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 6px; background: rgba(0,0,0,0.02); padding: 4px 8px; border-radius: 14px; border: 1px solid rgba(0,0,0,0.04); }
        .search-bar input { border: none; border-radius: 14px; padding: 3px 8px; font-size: 0.6rem; background: white; flex: 1 0 50px; min-width: 40px; border: 1px solid #e2e8f0; }
        .search-bar input:focus { outline: none; border-color: #2b6cb0; }

        .badge { background: #bee3f8; padding: 2px 10px; border-radius: 16px; font-size: 0.55rem; color: #2b6cb0; font-weight: 500; }
        .empty-state { color: #a0aec0; text-align: center; padding: 16px 0; font-size: 0.65rem; }
        .selected-display { font-size: 0.7rem; font-weight: 600; color: #2b6cb0; }

        .lang-display .lang-tag { background: #ebf8ff; color: #2b6cb0; padding: 1px 10px; border-radius: 14px; font-size: 0.6rem; border: 1px solid #bee3f8; }
        .lang-display .empty-hint { color: #a0aec0; font-size: 0.65rem; }
        .right-list { flex: 1; overflow-y: auto; min-height: 0; }
        .right-list::-webkit-scrollbar { width: 3px; }
        .right-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #2d3748; color: white; padding: 10px 28px; border-radius: 30px; font-size: 0.75rem; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .toast.show { opacity: 1; }
        .btn-disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: white; border-radius: 28px; padding: 24px 28px; max-width: 520px; width: 92%; max-height: 90vh; overflow-y: auto; box-shadow: 0 30px 60px rgba(0,0,0,0.2); }
        .modal-box h3 { margin-top: 0; margin-bottom: 14px; font-size: 1rem; font-weight: 700; color: #1a202c; }
        .modal-box .form-group { margin-bottom: 8px; }

        .modal-box .form-group input, .modal-box .form-group select { width: 100%; padding: 5px 10px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 0.65rem; }
        .modal-box .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }

        .modal-box .avatar-preview-modal { width: 50px; height: 50px; border-radius: 25px; object-fit: cover; border: 2px solid #e2e8f0; background: #f7fafc; }
        .password-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(6px); z-index: 2000; justify-content: center; align-items: center; }
        .password-overlay.active { display: flex; }

        .lang-bar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 4px 0 4px 0; border-bottom: 1px solid rgba(0,0,0,0.05); margin-bottom: 4px; }

        .lang-filter-group .lang-btn:hover { background: #f7fafc; }

        .lang-filter-group .lang-btn.all-lang { border-color: #a0aec0; background: #f7fafc; }
        .lang-filter-group .lang-btn.all-lang.active { background: #4a5568; color: white; border-color: #4a5568; }

        .detail-client-card { border-bottom: 1px solid #edf2f7; padding: 6px 4px; background: rgba(255,255,255,0.5); border-radius: 12px; margin-bottom: 3px; transition: 0.15s; }

            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);

            if (/^\d{4}\/\d{1,2}\/\d{1,2}$/.test(clean)) {
                d = new Date(clean.replace(/\//g, '-') + 'T00:00:00');
                if (!isNaN(d)) return d;
            }
            return null;
        }

        function isInTimeRange(timeStr, start, end) {
            if (!timeStr) return false;
            const d = new Date(timeStr);
            if (isNaN(d)) return false;
            if (start && d < start) return false;
            if (end && d > end) return false;
            return true;
        }

        // ===== 数据迁移：给旧数据打 group 字段 =====
        async function migrateOldData() {
            const collections = [
                { col: receptionCodesCol, name: '接待号' },
                { col: languagesCol, name: '语言' },
                { col: accountsCol, name: '员工账号' },
                { col: langCycleCol, name: '循环设置' },
                { col: employeesCol, name: '员工' }
            ];
            
            for (const { col, name } of collections) {
                try {
                    const snap = await getDocs(col);
                    let count = 0;
                    for (const d of snap.docs) {
                        const data = d.data();
                        if (!data.group) {
                            // 员工有前缀的除外，其他都归主小组
                            let targetGroup = MAIN_GROUP_NAME;
                            if (name === '员工' && data.name && data.name.includes('_')) {
                                // 员工名带下划线的，前缀就是所属小组
                                const prefix = data.name.split('_')[0];
                                targetGroup = prefix;
                            }
                            await updateDoc(doc(db, col.id || col.path.split('/').pop(), d.id), {
                                group: targetGroup
                            });
                            count++;
                        }
                    }
                    if (count > 0) console.log(`✅ 已迁移 ${name}: ${count} 条 → 归属小组`);
                } catch(e) { console.error(`迁移 ${name} 失败`, e); }
            }
        }

        // ===== 加载小组 =====
        async function loadGroups() {
            try {
                const snap = await getDocs(groupsCol);
                if (snap.empty) {
                    const ref = await addDoc(groupsCol, { 
                        name: MAIN_GROUP_NAME, 
                        passwordHash: MAIN_GROUP_PWD_HASH,
                        isMain: true 
                    });
                    groups = [{ id: ref.id, name: MAIN_GROUP_NAME, passwordHash: MAIN_GROUP_PWD_HASH, isMain: true }];
                    console.log('✅ 已创建主小组');
                } else {
                    const docs = snap.docs;
                    const migrated = [];
                    for (const d of docs) {
                        const data = d.data();
                        if (data.password && !data.passwordHash) {
                            const hash = await sha256(data.password);
                            await updateDoc(doc(db, 'groups', d.id), { passwordHash: hash });
                            data.passwordHash = hash;
                            migrated.push(data.name);
                        } else if (data.name === MAIN_GROUP_NAME && data.passwordHash !== MAIN_GROUP_PWD_HASH) {
                            await updateDoc(doc(db, 'groups', d.id), { passwordHash: MAIN_GROUP_PWD_HASH });
                            data.passwordHash = MAIN_GROUP_PWD_HASH;
                            migrated.push(data.name + '(重置)');
                        } else if (!data.passwordHash) {
                            await updateDoc(doc(db, 'groups', d.id), { passwordHash: MAIN_GROUP_PWD_HASH });
                            data.passwordHash = MAIN_GROUP_PWD_HASH;
                            migrated.push(data.name + '(默认)');
                        }
                    }
                    groups = docs.map(d => ({ id: d.id, ...d.data() }));
                    const mainExists = groups.some(g => g.name === MAIN_GROUP_NAME);
                    if (!mainExists) {
                        const ref = await addDoc(groupsCol, { 
                            name: MAIN_GROUP_NAME, 
                            passwordHash: MAIN_GROUP_PWD_HASH,
                            isMain: true 
                        });
                        groups.push({ id: ref.id, name: MAIN_GROUP_NAME, passwordHash: MAIN_GROUP_PWD_HASH, isMain: true });
                    }
                    if (migrated.length > 0) console.log('✅ 已自动迁移:', migrated.join(', '));
                    console.log('📋 已加载小组:', groups.map(g => g.name));
                }
            } catch (err) {
                console.error('❌ 加载小组失败:', err);
                groups = [{ id: 'default', name: MAIN_GROUP_NAME, passwordHash: MAIN_GROUP_PWD_HASH, isMain: true }];
            }
            
            if (!currentGroup) {
                const main = groups.find(g => g.isMain || g.name === MAIN_GROUP_NAME);
                currentGroup = main || groups[0];
            }
        }

        function setupPasteImage() {

                for (let item of items) {
                    if (item.type.startsWith('image/')) {
                        e.preventDefault();
                        const file = item.getAsFile();
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            const base64 = ev.target.result;
                            input.value = base64;
                            const img = document.getElementById('avatarPreview');
                            img.src = base64;
                            img.style.display = 'block';
                        };
                        reader.readAsDataURL(file);

        async function initData() {
            if (!groups || groups.length === 0) {
                await loadGroups();
            }
            if (!currentGroup) {
                const main = groups.find(g => g.isMain || g.name === MAIN_GROUP_NAME);
                currentGroup = main || groups[0];
            }
            updateGroupLabel();
            renderGroupList();

            // ===== 首次运行时迁移旧数据 =====
            await migrateOldData();

            // ===== 员工：按当前小组过滤 =====
            const allEmpSnap = await getDocs(employeesCol);
            const allEmployees = allEmpSnap.docs.map(d => ({ ...d.data(), _id: d.id }));
            
            if (currentGroup.isMain || currentGroup.name === MAIN_GROUP_NAME) {
                employees = allEmployees
                    .filter(e => !e.group || e.group === MAIN_GROUP_NAME)
                    .map(e => e.name);
            } else {
                const prefix = currentGroup.name + '_';
                employees = allEmployees
                    .filter(e => e.group === currentGroup.name || e.name.startsWith(prefix))
                    .map(e => e.name);
            }
            console.log('当前小组:', currentGroup.name, '可见员工:', employees);

            // ===== 语言：按当前小组过滤 =====
            const langSnap = await getDocs(query(languagesCol, where('group', '==', currentGroup.name)));
            if (langSnap.empty && (currentGroup.isMain || currentGroup.name === MAIN_GROUP_NAME)) {
                // 主小组首次运行，创建默认语言
                for (const lang of ['中文', '英语', '葡萄牙语', '西班牙语']) {
                    await addDoc(languagesCol, { name: lang, group: MAIN_GROUP_NAME });
                }
                languageTags = ['中文', '英语', '葡萄牙语', '西班牙语'];
            } else {
                languageTags = langSnap.docs.map(d => d.data().name);
            }

            // ===== 员工账号：按当前小组过滤 =====
            const accSnap = await getDocs(query(accountsCol, where('group', '==', currentGroup.name)));
            employeeAccounts = {};
            accSnap.docs.forEach(doc => {
                const data = doc.data();
                if (employees.includes(data.employee)) {
                    if (!employeeAccounts[data.employee]) employeeAccounts[data.employee] = [];
                    employeeAccounts[data.employee].push({ url: data.url, lang: data.lang || '', id: doc.id });
                }
            });

            // ===== 接待号：按当前小组过滤 =====
            const codeSnap = await getDocs(query(receptionCodesCol, where('group', '==', currentGroup.name)));
            receptionCodes = codeSnap.docs.map(d => d.data().code);

            // ===== 循环设置：按当前小组过滤 =====
            const langCycleSnap = await getDocs(query(langCycleCol, where('group', '==', currentGroup.name)));
            langCycleState = {};
            langCycleSnap.docs.forEach(doc => {
                const data = doc.data();
                langCycleState[data.lang] = {
                    cycleOrder: data.cycleOrder || [],
                    copyIndex: data.copyIndex || 0,
                    activeEmployees: data.activeEmployees || {}
                };
            });

            languageTags.forEach(lang => {
                if (!langCycleState[lang]) {
                    langCycleState[lang] = { cycleOrder: [...employees], copyIndex: 0, activeEmployees: {} };
                }
                employees.forEach(emp => {
                    if (langCycleState[lang].activeEmployees[emp] === undefined) {
                        langCycleState[lang].activeEmployees[emp] = true;
                    }
                });
                employees.forEach(emp => {
                    if (!langCycleState[lang].cycleOrder.includes(emp)) {
                        langCycleState[lang].cycleOrder.push(emp);
                    }
                });
                langCycleState[lang].cycleOrder = langCycleState[lang].cycleOrder.filter(emp => employees.includes(emp));
            });

            if (employees.length > 0 && !selectedReceptionEmployee) {
                selectedReceptionEmployee = employees[0];
            }
            if (receptionCodes.length > 0 && !selectedReceptionCode) {
                selectedReceptionCode = receptionCodes[0];
            }

            const q = query(clientsCol, orderBy('createdAt', 'desc'));
            onSnapshot(q, (snapshot) => {
                clients = snapshot.docs.map(doc => ({ firebaseId: doc.id, ...doc.data() }));
                renderAll();
            });

            renderAll();
        }

            if (!confirm(`删除 "${lang}" ？`)) return;
            const snap = await getDocs(query(languagesCol,

        window.toggleLangEmployee = async function(lang, emp, active) {
            if (!langCycleState[lang]) {
                langCycleState[lang] = { cycleOrder: [...employees], copyIndex: 0, activeEmployees: {} };

            langCycleState[lang].activeEmployees[emp] = active;
            const state = langCycleState[lang];
            const activeEmps = employees.filter(e => state.activeEmployees[e] !== false);
            state.cycleOrder = state.cycleOrder.filter(e => activeEmps.includes(e));
            activeEmps.forEach(e => {
                if (!state.cycleOrder.includes(e)) state.cycleOrder.push(e);
            });
            if (state.copyIndex >= state.cycleOrder.length) state.copyIndex = 0;
            await saveLangCycleState(lang);
            renderAll();
            showToast(`${lang}: ${emp} ${active ? '参与' : '不参与'}`);

        window.copyNextAccount = function() {
            const currentLang = selectedCopyLanguage;
            if (currentLang === 'all') { showToast('⚠️ 请先选择具体语言'); return; }
            if (!langCycleState[currentLang]) {
                langCycleState[currentLang] = { cycleOrder: [...employees], copyIndex: 0, activeEmployees: {} };
                employees.forEach(emp => { langCycleState[currentLang].activeEmployees[emp] = true; });
            }
            const state = langCycleState[currentLang];
            let activeEmployees = state.cycleOrder.filter(emp =>
                state.activeEmployees[emp] !== false &&
                (employeeAccounts[emp] || []).length > 0 &&
                (employeeAccounts[emp] || []).some(a => a.lang === currentLang)
            );
            if (activeEmployees.length === 0) {
                showToast(`❌ 语言 "${currentLang}" 下没有可用账号`);
                return;
            }
            if (state.copyIndex >= activeEmployees.length) state.copyIndex = 0;
            const selectedEmp = activeEmployees[state.copyIndex];
            state.copyIndex = (state.copyIndex + 1) % activeEmployees.length;
            saveLangCycleState(currentLang);

            let accounts = employeeAccounts[selectedEmp] || [];
            accounts = accounts.filter(a => a.lang === currentLang);
            if (accounts.length === 0) { copyNextAccount(); return; }

            const randomIdx = Math.floor(Math.random() * accounts.length);
            const url = accounts[randomIdx].url;
            const username = extractUsername(url);

            selectedReceptionEmployee = selectedEmp;
            document.getElementById('selectedEmployee').value = selectedEmp;
            document.getElementById('selectedEmployeeDisplay').textContent = selectedEmp;
            renderReceptionEmployeeButtons();

            navigator.clipboard.writeText(url).then(() => {
                showToast(`✅ ${selectedEmp} | ${username}`);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = url;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast(`✅ ${selectedEmp} | ${username}`);
            });
            document.getElementById('receptionCode').value = username;
        };

        window.copyClientInfo = function(firebaseId) {
            const client = clients.find(c => c.firebaseId === firebaseId);
            if (!client) { showToast('❌ 客户不存在'); return; }

            let timeStr = '';
            if (client.time) {
                const match = client.time.match(/(\d{4})-(\d{2})-(\d{2})/);
                if (match) {
                    timeStr = match[2] + match[3];
                } else {
                    const clean = client.time.replace(/[年月]/g, '-').replace(/[日时]/g, ' ').replace(/[点分]/g, ':');
                    const d = new Date(clean);
                    if (!isNaN(d)) {
                        const month = String(d.getMonth() + 1).padStart(2, '0');
                        const day = String(d.getDate()).padStart(2, '0');
                        timeStr = month + day;
                    } else {
                        timeStr = client.time.substring(0, 10).replace(/-/g, '').slice(2);
                    }
                }
            }

            const name = client.name || '-';
            const persona = client.persona || '';
            const code = client.code || '';
            const address = client.address || '-';

            const copyText = `${timeStr || '----'} - ${name} - ${persona}/${code} - ${address}`;

            navigator.clipboard.writeText(copyText).then(() => {
                showToast(`✅ 已复制: ${copyText}`);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = copyText;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast(`✅ 已复制: ${copyText}`);
            });
        };

        function filterClients(list, searchParams) {
            const { clientId, name, code, timeStart, timeEnd, employee, filter, langValue } = searchParams;
            let result = list;
            if (clientId) result = result.filter(c => (c.clientId || '').includes(clientId));
            if (name) result = result.filter(c => (c.name || '').includes(name));
            if (code) result = result.filter(c => (c.code || '').includes(code));
            if (employee) result = result.filter(c => (c.employee || '').includes(employee));
            if (timeStart || timeEnd) {
                const start = timeStart ? parseTimeInput(timeStart) : null;
                const end = timeEnd ? parseTimeInput(timeEnd) : null;
                result = result.filter(c => isInTimeRange(c.time, start, end));
            }
            if (filter === 'added') result = result.filter(c => c.addedTime);
            else if (filter === 'unadded') result = result.filter(c => !c.addedTime);
            if (langValue && langValue !== 'all') {
                result = result.filter(c => c.language === langValue);
            }
            return result;
        }

                clientId: document.getElementById('thirdSearchClientId').value.trim(),
                name: document.getElementById('thirdSearchName').value.trim(),
                code: document.getElementById('thirdSearchCode').value.trim(),
                timeStart: document.getElementById('thirdSearchTimeStart').value.trim(),
                timeEnd: document.getElementById('thirdSearchTimeEnd').value.trim(),
                employee: document.getElementById('thirdSearchEmployee').value.trim(),
                filter: thirdFilter,
                langValue: thirdLangFilterValue
            };
            list = filterClients(list, searchParams);
            if (!container) return;
            if (list.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无客户</div>';

            }

                const isAdded = !!c.addedTime;
                return `
                        <div class="detail-client-card ${isAdded ? 'highlight' : ''}">

                                <div class="client-info">
                                    <div><span class="label">名字</span> <span class="value">${c.name || '-'}</span></div>
                                    <div><span class="label">ID</span> <span class="value">${c.clientId || '-'}</span></div>
                                    <div><span class="label">地址</span> <span class="value">${c.address || '-'}</span></div>
                                    <div><span class="label">人设</span> <span class="value">${c.persona || '-'}</span></div>
                                    <div><span class="label">语言</span> <span class="value">${c.language || '-'}</span></div>
                                    <div><span class="label">接待时间</span> <span class="value">${c.time || '-'}</span></div>
                                    <div><span class="label">接待号</span> <span class="value">${c.code || '-'}</span></div>
                                    <div><span class="label">员工</span> <span class="value">${c.employee || '-'}</span></div>
                                    <div><span class="label">添加账号</span> <span class="value" style="color:#2b6cb0;font-weight:600;">${c.addedAccount || '-'}</span></div>
                                    <div><span class="label">状态</span> <span class="value">${isAdded ? '已添加 ' + c.addedTime : '未添加'}</span></div>
                                </div>

                                <button class="btn btn-sm btn-outline" onclick="copyClientInfo('${c.firebaseId}')" style="font-size:0.55rem;padding:2px 10px;">📋 复制</button>
                                <button class="btn btn-sm ${isAdded ? 'btn-disabled btn-outline' : 'btn-success'}" onclick="${isAdded ? '' : `markAdded('${c.firebaseId}')`}" ${isAdded ? 'disabled' : ''}>

                                </button>
                            </div>

                    `;
            }).join('');
            updateStats(list);

        window.removeEmployee = async function(emp) {
            if (!confirm(`删除 "${emp}" ？`)) return;
            const snap = await getDocs(query(employeesCol, 
                where('name', '==', emp),
                where('group', '==', currentGroup.name)));
            for (const doc of snap.docs) await deleteDoc(doc.ref);
            const accSnap = await getDocs(query(accountsCol, 
                where('employee', '==', emp),
                where('group', '==', currentGroup.name)));
            for (const doc of accSnap.docs) await deleteDoc(doc.ref);
            delete employeeAccounts[emp];
            const allSnap = await getDocs(employeesCol);
            const allEmployees = allSnap.docs.map(d => ({ ...d.data(), _id: d.id }));
            if (currentGroup.isMain || currentGroup.name === MAIN_GROUP_NAME) {
                employees = allEmployees.filter(e => !e.group || e.group === MAIN_GROUP_NAME).map(e => e.name);
            } else {
                const prefix = currentGroup.name + '_';
                employees = allEmployees.filter(e => e.group === currentGroup.name || e.name.startsWith(prefix)).map(e => e.name);
            }
            for (const lang in langCycleState) {
                const state = langCycleState[lang];
                state.cycleOrder = state.cycleOrder.filter(e => e !== emp);
                delete state.activeEmployees[emp];
                if (state.copyIndex >= state.cycleOrder.length) state.copyIndex = 0;
                await saveLangCycleState(lang);
            }
            if (thirdSelectedEmployee === emp) thirdSelectedEmployee = 'all';
            if (selectedReceptionEmployee === emp && employees.length > 0) {
                selectedReceptionEmployee = employees[0];
            } else if (employees.length === 0) { selectedReceptionEmployee = ''; }
            renderAll();
            showToast(`已删除: ${emp}`);
        };

        window.addEmployee = async function() {
            const name = prompt('输入员工姓名：');
            if (!name || !name.trim()) return;
            let finalName = name.trim();
            if (currentGroup && !currentGroup.isMain && currentGroup.name !== MAIN_GROUP_NAME) {
                finalName = currentGroup.name + '_' + name.trim();
            }
            if (employees.includes(finalName)) { alert('该员工已存在'); return; }
            await addDoc(employeesCol, { 
                name: finalName, 
                group: currentGroup?.name || MAIN_GROUP_NAME 
            });
            employeeAccounts[finalName] = [];
            const allSnap = await getDocs(employeesCol);
            const allEmployees = allSnap.docs.map(d => ({ ...d.data(), _id: d.id }));
            if (currentGroup.isMain || currentGroup.name === MAIN_GROUP_NAME) {
                employees = allEmployees.filter(e => !e.group || e.group === MAIN_GROUP_NAME).map(e => e.name);
            } else {
                const prefix = currentGroup.name + '_';
                employees = allEmployees.filter(e => e.group === currentGroup.name || e.name.startsWith(prefix)).map(e => e.name);
            }
            for (const lang in langCycleState) {
                const state = langCycleState[lang];
                if (!state.cycleOrder.includes(finalName)) state.cycleOrder.push(finalName);
                state.activeEmployees[finalName] = true;
                await saveLangCycleState(lang);
            }
            if (!selectedReceptionEmployee && employees.length > 0) {
                selectedReceptionEmployee = employees[0];
            }
            renderAll();
            showToast(`✅ 已添加: ${finalName}`);
        };

        window.markAdded = async function(firebaseId) {
            try {
                await updateDoc(doc(db, 'clients', firebaseId), { addedTime: getChinaTime() });
                showToast('✅ 已标记');
            } catch (e) { alert('标记失败'); }
        };

        window.unmarkAdded = async function(firebaseId) {
            if (!confirm('取消标记？')) return;
            try {
                await updateDoc(doc(db, 'clients', firebaseId), { addedTime: null });
                showToast('已取消');
            } catch (e) { alert('操作失败'); }
        };

        window.deleteClient = async function(firebaseId) {
            if (!confirm('确定删除？')) return;
            try {
                await deleteDoc(doc(db, 'clients', firebaseId));
                showToast('已删除');
            } catch (e) { alert('删除失败'); }
        };

        window.openEditModal = function(firebaseId) {
            const client = clients.find(c => c.firebaseId === firebaseId);
            if (!client) { alert('不存在'); return; }
            editingClientId = firebaseId;
            document.getElementById('editAvatarInput').value = client.avatar || '';
            document.getElementById('editAvatarPreview').src = client.avatar || '';
            document.getElementById('editAvatarPreview').style.display = client.avatar ? 'block' : 'none';
            document.getElementById('editName').value = client.name || '';
            document.getElementById('editClientId').value = client.clientId || '';
            document.getElementById('editAddress').value = client.address || '';
            document.getElementById('editPersona').value = client.persona || '';
            document.getElementById('editTime').value = client.time || '';
            document.getElementById('editAddedAccount').value = client.addedAccount || '';
            document.getElementById('editLanguage').value = client.language || '';
            document.getElementById('editCode').value = client.code || (receptionCodes.length > 0 ? receptionCodes[0] : '');
            document.getElementById('editEmployee').value = client.employee || (employees.length ? employees[0] : '');
            document.getElementById('editModal').classList.add('active');
        };

        window.closeEditModal = function() {
            document.getElementById('editModal').classList.remove('active');
            editingClientId = null;
        };

        window.saveEdit = async function() {
            if (!editingClientId) { alert('没有选中'); return; }
            const data = {
                avatar: document.getElementById('editAvatarInput').value.trim(),
                name: document.getElementById('editName').value.trim(),
                clientId: document.getElementById('editClientId').value.trim(),
                address: document.getElementById('editAddress').value.trim(),
                persona: document.getElementById('editPersona').value.trim(),
                time: document.getElementById('editTime').value.trim(),
                code: document.getElementById('editCode').value,
                employee: document.getElementById('editEmployee').value,
                addedAccount: document.getElementById('editAddedAccount').value.trim(),
                language: document.getElementById('editLanguage').value
            };
            if (!data.name) { alert('名字不能为空'); return; }
            try {
                await updateDoc(doc(db, 'clients', editingClientId), data);
                closeEditModal();
                showToast('✅ 已保存');
            } catch (e) { alert('保存失败'); }
        };

        window.handleSubmit = async function() {
            const avatar = document.getElementById('avatarInput').value.trim();
            const name = document.getElementById('clientName').value.trim();
            const clientId = document.getElementById('clientId').value.trim();
            const address = document.getElementById('clientAddr').value.trim();
            const persona = document.getElementById('clientPersona').value.trim();
            const language = document.getElementById('clientLanguage').value || '';
            let time = document.getElementById('receptionTime').value.trim();
            const code = document.getElementById('selectedCode').value || (receptionCodes.length > 0 ? receptionCodes[0] : '');
            const employee = document.getElementById('selectedEmployee').value || (employees.length > 0 ? employees[0] : '');
            const addedAccount = document.getElementById('receptionCode').value.trim() || '';

            if (!name) { alert('客户名字不能为空'); return; }
            if (!employee) { alert('请选择员工'); return; }
            if (!code) { alert('请选择接待号'); return; }
            if (!time) time = getChinaTime();

            const alertDiv = document.getElementById('duplicateAlert');
            const compareDiv = document.getElementById('compareList');
            alertDiv.style.display = 'none';
            compareDiv.innerHTML = '';

            if (clientId) {
                const idQuery = query(clientsCol, where('clientId', '==', clientId));
                const idSnap = await getDocs(idQuery);
                if (!idSnap.empty) {
                    const existing = idSnap.docs[0].data();
                    alertDiv.style.display = 'block';
                    alertDiv.innerHTML = `❌ ID重复: "${existing.name}" (${clientId})`;
                    return;
                }
            }

            const nameQuery = query(clientsCol, where('name', '==', name));
            const nameSnap = await getDocs(nameQuery);
            if (!nameSnap.empty) {
                const sameList = nameSnap.docs.map(d => ({ firebaseId: d.id, ...d.data() }));
                compareDiv.innerHTML =
                    `<div style="background:#fef9e7;padding:6px;border-radius:10px;font-size:0.65rem;"><strong>⚠️ 同名客户 (${sameList.length}个)</strong> 悬停头像放大</div>`;
                sameList.forEach(c => {
                    compareDiv.innerHTML += `
                            <div class="compare-card">
                                <div class="compare-row">
                                    <div class="compare-avatar-wrapper">
                                        <img src="${c.avatar || ''}" class="avatar-large" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22 viewBox=%220 0 80 80%22%3E%3Crect width=%2280%22 height=%2280%22 fill=%22%23edf2f7%22/%3E%3Ctext x=%2218%22 y=%2246%22 font-size=%2228%22 fill=%22%23a0aec0%22%3E📷%3C/text%3E%3C/svg%3E'">
                                        <span style="font-size:0.55rem;color:#718096;">🖱️ 放大</span>
                                    </div>
                                    <div class="compare-info">
                                        <div><span class="lbl">名字</span> ${c.name}</div>
                                        <div><span class="lbl">ID</span> ${c.clientId || '-'}</div>
                                        <div><span class="lbl">语言</span> ${c.language || '-'}</div>
                                        <div><span class="lbl">员工</span> ${c.employee || '-'}</div>
                                    </div>
                                </div>
                                <div class="compare-actions">
                                    <button class="btn btn-sm btn-success" onclick="confirmNewClient()">✅ 新客户</button>
                                    <button class="btn btn-sm btn-danger" onclick="confirmDuplicate()">❌ 重复</button>
                                </div>
                            </div>
                        `;
                });
                window._pendingNewClient = { avatar, name, clientId, address, persona, language, time, code, employee,
                    addedAccount };
                return;
            }
            await doAddClient(avatar, name, clientId, address, persona, language, time, code, employee, addedAccount);
        };

        window.confirmNewClient = async function() {
            const data = window._pendingNewClient;
            if (!data) return;
            await doAddClient(data.avatar, data.name, data.clientId, data.address, data.persona, data.language, data.time,
                data.code, data.employee, data.addedAccount);
            document.getElementById('compareList').innerHTML = '';
            window._pendingNewClient = null;
        };

        window.confirmDuplicate = function() {
            document.getElementById('compareList').innerHTML = '';
            document.getElementById('duplicateAlert').style.display = 'block';
            document.getElementById('duplicateAlert').innerHTML = '⛔ 已取消录入。';
            window._pendingNewClient = null;
        };

        async function doAddClient(avatar, name, clientId, address, persona, language, time, code, employee, addedAccount) {
            await addDoc(clientsCol, {
                avatar: avatar || '',
                name,
                clientId: clientId || '',
                address: address || '',
                persona: persona || '',
                language: language || '',
                time: time || '',
                code: code || '',
                employee: employee || '',
                addedAccount: addedAccount || '',
                addedTime: null,
                createdAt: new Date().toISOString()
            });
            ['avatarInput', 'clientName', 'clientId', 'clientAddr', 'clientPersona', 'receptionTime', 'receptionCode']
            .forEach(id => document.getElementById(id).value = '');
            document.getElementById('avatarPreview').style.display = 'none';
            document.getElementById('duplicateAlert').style.display = 'none';
            document.getElementById('compareList').innerHTML = '';
            showToast('✅ 录入成功');
        }

        window.applySearch = function() {
            renderReceptionList(null);
        };

        window.clearSearch = function() {
            ['searchClientId', 'searchName', 'searchCode', 'searchTimeStart', 'searchTimeEnd', 'searchEmployee']
            .forEach(id => document.getElementById(id).value = '');
            renderReceptionList(null);
        };

        window.applyThirdSearch = function() {
            renderThirdDetail(null);
        };

        window.clearThirdSearch = function() {
            ['thirdSearchClientId', 'thirdSearchName', 'thirdSearchCode', 'thirdSearchTimeStart', 'thirdSearchTimeEnd',
                'thirdSearchEmployee'
            ]
            .forEach(id => document.getElementById(id).value = '');
            renderThirdDetail(null);
        };

        window.goBack = function() {
            document.getElementById('receptionApp').classList.remove('active');
            document.getElementById('thirdApp').classList.remove('active');
            document.getElementById('entryScreen').style.display = 'flex';
        };

        document.querySelector('.entry-screen').insertAdjacentHTML('beforeend', `
            <div style="width:100%; text-align:center; margin-top:8px;">
                <button class="btn btn-primary" onclick="openGroupManage()">👥 小组管理</button>
            </div>
        `);

        window.renderGroupList = renderGroupList;
        window.updateGroupLabel = updateGroupLabel;
        window.currentGroup = currentGroup;
        window.getVisibleClients = getVisibleClients;
        window.openGroupManage = openGroupManage;

        // 页面加载时预加载小组
        (async () => {
            await loadGroups();
            console.log('页面已就绪');
        })();

    </script>
